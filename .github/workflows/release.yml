name: Release foundation

# Verification only. OL-83 must deliver and review the complete candidate
# pipeline before any publishing job or write permission is added.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/RELEASING.md"
      - ".goreleaser.yml"
      - "scripts/check-release*"
      - "apps/desktop/scripts/package.mjs"
  push:
    branches: [main]
    tags: ["v*-labrastro.*"]
    paths:
      - ".github/workflows/release.yml"
      - ".github/RELEASING.md"
      - ".goreleaser.yml"
      - "scripts/check-release*"
      - "apps/desktop/scripts/package.mjs"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'AstralSolipsism/multica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the fork
        uses: actions/checkout@v4
        with:
          repository: AstralSolipsism/multica
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test candidate guards and publishing isolation
        run: node --test scripts/check-release.test.mjs

      - name: Validate a pushed candidate tag
        if: github.ref_type == 'tag'
        env:
          LABRASTRO_RELEASE_REPOSITORY: AstralSolipsism/multica
          LABRASTRO_RELEASE_TAG: ${{ github.ref_name }}
          LABRASTRO_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/check-release.mjs --require-tag

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/release.yml

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
