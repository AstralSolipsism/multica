# Build from this checkout. Make supplies development identity; candidate
# builds use scripts/local-images.mjs and an exact tracked source snapshot.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:?Set VERSION from the source identity}
        COMMIT: ${COMMIT:?Set COMMIT to the full source SHA}
        DATE: ${DATE:?Set DATE to the source commit time}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VERSION: ${VERSION:?Set VERSION from the source identity}
        COMMIT: ${COMMIT:?Set COMMIT to the full source SHA}
        DATE: ${DATE:?Set DATE to the source commit time}
        NEXT_PUBLIC_APP_VERSION: ${VERSION:?Set VERSION from the source identity}
