<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Labrastro">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png). Full-bleed because both surfaces mask the artwork
    themselves: iOS rounds the corners, Android crops to the launcher shape.
    The mark is /favicon.svg's paw print, inverted to the dark app-icon
    treatment the desktop and mobile builds already ship, with the mark box at
    52% of the canvas (ink spans ~44%) so it stays well inside the maskable
    safe zone (the centre circle of 80% diameter). See app/manifest.ts for
    the regeneration commands.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <g
    fill="#ffffff"
    transform="translate(122.88 122.88) scale(2.6624)"
  >
    <ellipse cx="18.5" cy="42" rx="10.5" ry="14" transform="rotate(-24 18.5 42)"/>
    <ellipse cx="38.5" cy="27" rx="10.5" ry="14" transform="rotate(-8 38.5 27)"/>
    <ellipse cx="61.5" cy="27" rx="10.5" ry="14" transform="rotate(8 61.5 27)"/>
    <ellipse cx="81.5" cy="42" rx="10.5" ry="14" transform="rotate(24 81.5 42)"/>
    <ellipse cx="50" cy="70" rx="24" ry="19"/>
  </g>
</svg>
